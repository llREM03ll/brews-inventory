<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BREWS.CO – History</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* ── Page layout ── */
    body { align-items: flex-start; padding: 20px 0; }
    .container { max-width: 780px; }

    /* ── Back nav ── */
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none; cursor: pointer;
      color: #7a5c3e; font-weight: 600; font-size: 0.95rem;
      padding: 0; margin-bottom: 16px;
      font-family: inherit;
    }
    .back-btn:hover { color: #5c4631; }

    /* ── Month nav ── */
    .month-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .month-nav h2 { margin: 0; font-size: 1.4rem; color: #7a5c3e; }
    .month-nav button {
      background: #e8d5c4; border: none; border-radius: 8px;
      padding: 8px 14px; font-weight: 700; font-size: 1rem;
      cursor: pointer; color: #5c4631; transition: all .2s;
    }
    .month-nav button:hover { background: #d4b89e; }

    /* ── Calendar ── */
    .calendar { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
    .calendar th {
      background: #f5eee6; color: #5c4631; font-weight: 600;
      padding: 8px 4px; text-align: center; font-size: 0.85rem;
    }
    .calendar td {
      border: 1px solid #e8d5c4; vertical-align: top;
      height: 72px; padding: 6px; cursor: default;
      background: #fffaf5; width: calc(100% / 7);
      transition: background .15s;
    }
    .calendar td.empty { background: #f9f5f0; cursor: default; }
    .calendar td.has-entry { cursor: pointer; }
    .calendar td.has-entry:hover { background: #f5eee6; }
    .calendar td.today { outline: 2px solid #c7a27c; outline-offset: -2px; }

    .day-num {
      font-size: 0.8rem; font-weight: 600; color: #9ca3af;
      display: block; margin-bottom: 4px;
    }
    .calendar td.has-entry .day-num { color: #5c4631; }
    .day-total {
      font-size: 0.78rem; font-weight: 700; color: #7a5c3e;
      line-height: 1.3;
    }
    .day-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #c7a27c; margin-top: 4px;
    }

    /* ── Monthly Expenses ── */
    .monthly-exp-section { margin-top: 8px; }

    /* ── Monthly Summary ── */
    .monthly-summary {
      margin-top: 16px; background: #f5eee6;
      border-radius: 12px; padding: 14px 16px;
      border: 1px solid #e8d5c4;
    }
    .monthly-summary h3 { margin: 0 0 10px; color: #5c4631; font-size: 1rem; }
    .summary-row {
      display: flex; justify-content: space-between;
      padding: 5px 0; font-size: 0.92rem; color: #5c4631;
      border-bottom: 1px solid #e8d5c4;
    }
    .summary-row:last-child { border-bottom: none; }
    .summary-row.sub {
      padding-left: 16px; color: #9ca3af; font-size: 0.85rem;
    }
    .summary-row.total {
      font-weight: 700; font-size: 1rem; color: #7a5c3e;
      border-top: 2px solid #c7a27c; margin-top: 4px; padding-top: 8px;
    }
    .summary-row span:last-child { font-variant-numeric: tabular-nums; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(92, 70, 49, 0.45);
      backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: #fffaf5; border-radius: 16px; padding: 24px;
      max-width: 560px; width: 100%; max-height: 80vh;
      overflow-y: auto; box-shadow: 0 12px 40px rgba(122,92,62,0.25);
      border: 1px solid #e8d5c4;
      transform: translateY(12px); transition: transform .2s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; border-bottom: 2px solid #e8d5c4; padding-bottom: 10px;
    }
    .modal-header h3 { margin: 0; color: #7a5c3e; font-size: 1.1rem; }
    .modal-close {
      background: #e8d5c4; border: none; border-radius: 8px;
      padding: 6px 12px; cursor: pointer; font-weight: 700;
      color: #5c4631; transition: background .2s;
    }
    .modal-close:hover { background: #d4b89e; }
    .modal-body table { font-size: 0.88rem; }

    @media (max-width: 600px) {
      .calendar td { height: 52px; padding: 4px; }
      .day-total { font-size: 0.7rem; }
      .day-num { font-size: 0.72rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>

    <div class="brand">BREWS.CO</div>

    <!-- Month navigation -->
    <div class="month-nav">
      <button onclick="changeMonth(-1)">&#8592;</button>
      <h2 id="monthTitle"></h2>
      <button onclick="changeMonth(1)">&#8594;</button>
    </div>

    <!-- Calendar -->
    <table class="calendar" id="calendarTable">
      <thead>
        <tr>
          <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th>
          <th>Thu</th><th>Fri</th><th>Sat</th>
        </tr>
      </thead>
      <tbody id="calendarBody"></tbody>
    </table>

    <!-- Monthly Expenses -->
    <div class="section monthly-exp-section">
      <h3>Monthly Expenses</h3>
      <div id="monthlyExpContainer"></div>
      <button class="add-expense-btn" onclick="addMonthlyExpRow()">+ Add Monthly Expense</button>
    </div>

    <!-- Monthly Summary -->
    <div class="monthly-summary" id="monthlySummary"></div>
  </div>

  <!-- Receipt Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalDate"></h3>
        <button class="modal-close" onclick="closeModalDirect()">✕ Close</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="js/history.js"></script>
  <script>
    // ── State ────────────────────────────────────────────────────────────────
    const today   = new Date();
    let curYear   = today.getFullYear();
    let curMonth  = today.getMonth(); // 0-indexed

    const MONTH_NAMES = [
      "January","February","March","April","May","June",
      "July","August","September","October","November","December"
    ];

    // ── Monthly Expense Storage ───────────────────────────────────────────────
    function monthKey() {
      return `brewsMonthlyExp_${curYear}-${String(curMonth + 1).padStart(2, "0")}`;
    }

    function saveMonthlyExpenses() {
      const rows = document.querySelectorAll("#monthlyExpContainer .expense-row");
      const list = [];
      rows.forEach(row => {
        const name  = row.querySelector(".exp-name").value.trim();
        const price = parseFloat(row.querySelector(".exp-price").value) || 0;
        if (name || price) list.push({ name, price });
      });
      localStorage.setItem(monthKey(), JSON.stringify(list));
      renderSummary();
    }

    function loadMonthlyExpenses() {
      try {
        return JSON.parse(localStorage.getItem(monthKey())) || [];
      } catch { return []; }
    }

    // ── Expense Row UI ────────────────────────────────────────────────────────
    function addMonthlyExpRow(name = "", price = "") {
      const container = document.getElementById("monthlyExpContainer");
      const row = document.createElement("div");
      row.className = "expense-row";
      row.innerHTML = `
        <input type="text"   class="exp-name"  placeholder="Expense name" value="${name}">
        <input type="number" class="exp-price" placeholder="₱0"           value="${price}">
        <button type="button" onclick="this.parentElement.remove(); saveMonthlyExpenses();">x</button>
      `;
      row.addEventListener("input", saveMonthlyExpenses);
      container.appendChild(row);
    }

    function renderMonthlyExpenses() {
      const container = document.getElementById("monthlyExpContainer");
      container.innerHTML = "";
      const list = loadMonthlyExpenses();
      if (list.length) {
        list.forEach(e => addMonthlyExpRow(e.name, e.price));
      } else {
        addMonthlyExpRow();
      }
    }

    // ── Extract final total from stored HTML ──────────────────────────────────
    function extractFinalTotal(html) {
      const div = document.createElement("div");
      div.innerHTML = html;
      const rows = div.querySelectorAll("tr");
      for (const row of rows) {
        const cells = row.querySelectorAll("td");
        if (cells.length >= 2 && cells[0].textContent.includes("Final Total")) {
          return cells[1].textContent.trim(); // e.g. "₱1,234.50"
        }
      }
      return null;
    }

    function parseMoney(str) {
      if (!str) return 0;
      return parseFloat(str.replace(/[₱,]/g, "")) || 0;
    }

    function formatMoney(value) {
      const num = Number(value) || 0;
      return "₱" + num.toLocaleString("en-PH", {
        minimumFractionDigits: 2, maximumFractionDigits: 2
      });
    }

    // ── Calendar Render ───────────────────────────────────────────────────────
    function renderCalendar() {
      document.getElementById("monthTitle").textContent =
        `${MONTH_NAMES[curMonth]} ${curYear}`;

      const history  = getAllHistory();
      const firstDay = new Date(curYear, curMonth, 1).getDay();
      const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
      const todayStr = today.toISOString().split("T")[0];

      // Build a map: "YYYY-MM-DD" → entry
      const entryMap = {};
      history.forEach(h => { entryMap[h.date] = h; });

      const tbody = document.getElementById("calendarBody");
      tbody.innerHTML = "";

      let dayCount = 1;
      const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;

      for (let i = 0; i < totalCells; i += 7) {
        const tr = document.createElement("tr");
        for (let j = 0; j < 7; j++) {
          const cell = i + j;
          const td   = document.createElement("td");
          const day  = cell - firstDay + 1;

          if (cell < firstDay || day > daysInMonth) {
            td.classList.add("empty");
          } else {
            const dateStr = `${curYear}-${String(curMonth + 1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
            const entry   = entryMap[dateStr];

            td.innerHTML = `<span class="day-num">${day}</span>`;

            if (entry) {
              const total = extractFinalTotal(entry.results);
              td.classList.add("has-entry");
              if (total) {
                td.innerHTML += `<div class="day-total">${total}</div>`;
              }
              td.innerHTML += `<div class="day-dot"></div>`;
              td.addEventListener("click", () => openModal(dateStr, entry));
            }

            if (dateStr === todayStr) td.classList.add("today");
          }

          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }

      renderMonthlyExpenses();
      renderSummary();
    }

    // ── Monthly Summary ───────────────────────────────────────────────────────
    function renderSummary() {
      const history  = getAllHistory();
      const prefix   = `${curYear}-${String(curMonth + 1).padStart(2, "0")}`;

      // Sum all daily Final Totals for this month
      let totalRevenue = 0;
      const dailyEntries = [];
      history.forEach(h => {
        if (h.date.startsWith(prefix)) {
          const val = extractFinalTotal(h.results);
          const num = parseMoney(val);
          totalRevenue += num;
          dailyEntries.push({ date: h.date, total: num });
        }
      });

      // Monthly expenses
      const expList = loadMonthlyExpenses().filter(e => e.name && e.price > 0);
      const totalExp = expList.reduce((s, e) => s + e.price, 0);
      const netIncome = totalRevenue - totalExp;

      const el = document.getElementById("monthlySummary");

      if (dailyEntries.length === 0 && expList.length === 0) {
        el.innerHTML = `<h3>Monthly Summary</h3><p style="color:#9ca3af; font-size:0.9rem;">No entries for ${MONTH_NAMES[curMonth]} ${curYear}.</p>`;
        return;
      }

      let html = `<h3>Monthly Summary — ${MONTH_NAMES[curMonth]} ${curYear}</h3>`;
      html += `<div class="summary-row"><span>Total Daily Revenue</span><span>${formatMoney(totalRevenue)}</span></div>`;

      if (expList.length) {
        html += `<div class="summary-row"><span>Monthly Expenses</span><span>- ${formatMoney(totalExp)}</span></div>`;
        expList.forEach(e => {
          html += `<div class="summary-row sub"><span>${e.name}</span><span>- ${formatMoney(e.price)}</span></div>`;
        });
      }

      html += `<div class="summary-row total"><span>Net Monthly Income</span><span>${formatMoney(netIncome)}</span></div>`;
      el.innerHTML = html;
    }

    // ── Month Navigation ──────────────────────────────────────────────────────
    function changeMonth(dir) {
      curMonth += dir;
      if (curMonth > 11) { curMonth = 0;  curYear++; }
      if (curMonth < 0)  { curMonth = 11; curYear--; }
      renderCalendar();
    }

    // ── Modal ─────────────────────────────────────────────────────────────────
    function openModal(dateStr, entry) {
      document.getElementById("modalDate").textContent = `Receipt — ${dateStr}`;
      document.getElementById("modalBody").innerHTML   = entry.results;
      document.getElementById("modalOverlay").classList.add("open");
    }

    function closeModalDirect() {
      document.getElementById("modalOverlay").classList.remove("open");
    }

    function closeModal(e) {
      if (e.target === document.getElementById("modalOverlay")) closeModalDirect();
    }

    // Close on Escape
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModalDirect();
    });

    // ── Init ──────────────────────────────────────────────────────────────────
    renderCalendar();
  </script>
</body>
</html>
